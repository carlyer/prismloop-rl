<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc" lang="en">
<title id="title">From visual interaction to policy improvement</title><desc id="desc">Implemented core pipeline · Image and Video are trained as separate models</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8392aa"/></marker>
<marker id="loop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#13866f"/></marker></defs>
<rect width="1440" height="1000" rx="24" fill="#f5f7fb"/>
<path d="M36 24H1404" stroke="#13866f" stroke-width="4"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,DejaVu Sans,sans-serif">
<text x="40" y="59" font-size="13" fill="#13866f" font-weight="700">PRISMLOOP-RL / RESEARCH WORKFLOW</text>
<text x="40" y="106" font-size="32" fill="#17243d" font-weight="700">From visual interaction to policy improvement</text>
<text x="40" y="142" font-size="17" fill="#596b85" font-weight="400">Implemented core pipeline · Image and Video are trained as separate models</text>
<rect x="40" y="180" width="420" height="245" rx="16" fill="#ffffff" stroke="#dae2ee"/>
<text x="62" y="212" font-size="13" fill="#13866f" font-weight="700">01 / INPUT</text>
<text x="62" y="249" font-size="23" fill="#17243d" font-weight="700">Visual question + source</text>
<text x="62" y="285" font-size="18" fill="#596b85" font-weight="400">Image: visible to policy and Python</text>
<text x="62" y="315" font-size="18" fill="#596b85" font-weight="400">Video: VideoReader in Python</text>
<text x="62" y="345" font-size="18" fill="#596b85" font-weight="400">Video frames are sampled on demand</text>
<text x="62" y="375" font-size="18" fill="#596b85" font-weight="400">8 sibling trajectories per question</text>
<rect x="510" y="180" width="420" height="245" rx="16" fill="#17243d" stroke="#dae2ee"/>
<text x="532" y="212" font-size="13" fill="#72dfc8" font-weight="700">02 / INTERACT</text>
<text x="532" y="249" font-size="23" fill="#f5f8ff" font-weight="700">Qwen2.5-VL ↔ Python</text>
<text x="532" y="285" font-size="18" fill="#cbd8ed" font-weight="400">Reason → &lt;code&gt; → execute</text>
<text x="532" y="315" font-size="18" fill="#cbd8ed" font-weight="400">Read text / images / errors → reason</text>
<text x="532" y="345" font-size="18" fill="#cbd8ed" font-weight="400">Persistent execution state across turns</text>
<text x="532" y="375" font-size="18" fill="#cbd8ed" font-weight="400">Repeat until final answer / stop condition</text>
<rect x="980" y="180" width="420" height="245" rx="16" fill="#ffffff" stroke="#dae2ee"/>
<text x="1002" y="212" font-size="13" fill="#13866f" font-weight="700">03 / TRAJECTORY</text>
<text x="1002" y="249" font-size="23" fill="#17243d" font-weight="700">Answer + interaction trace</text>
<text x="1002" y="285" font-size="18" fill="#596b85" font-weight="400">Model actions + tool observations</text>
<text x="1002" y="315" font-size="18" fill="#596b85" font-weight="400">Final &lt;answer&gt; contains a boxed value</text>
<text x="1002" y="345" font-size="18" fill="#596b85" font-weight="400">Action mask marks trainable tokens</text>
<text x="1002" y="375" font-size="18" fill="#596b85" font-weight="400">Keep sibling IDs and source labels</text>
<path d="M460 300H504" fill="none" stroke="#8392aa" stroke-width="2.3" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M930 300H974" fill="none" stroke="#8392aa" stroke-width="2.3" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M1190 425V514" fill="none" stroke="#8392aa" stroke-width="2.3" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="980" y="520" width="420" height="260" rx="16" fill="#ffffff" stroke="#dae2ee"/>
<text x="1002" y="552" font-size="13" fill="#13866f" font-weight="700">04 / REWARD → ADVANTAGE</text>
<text x="1002" y="589" font-size="23" fill="#17243d" font-weight="700">Score, then compute GRPO</text>
<text x="1002" y="625" font-size="18" fill="#596b85" font-weight="400">Answer: judge or final numeric MRA</text>
<text x="1002" y="655" font-size="18" fill="#596b85" font-weight="400">Tool: success, nonempty, deduplicated</text>
<text x="1002" y="685" font-size="18" fill="#596b85" font-weight="400">0.1 × at most 2 credits; answer gate</text>
<text x="1002" y="715" font-size="18" fill="#596b85" font-weight="400">Group advantages before selection</text>
<text x="1002" y="745" font-size="18" fill="#596b85" font-weight="400">No reward-std normalization; no KL loss</text>
<rect x="510" y="520" width="420" height="260" rx="16" fill="#ffffff" stroke="#dae2ee"/>
<text x="532" y="552" font-size="13" fill="#13866f" font-weight="700">05 / FILTER → SELECT</text>
<text x="532" y="589" font-size="23" fill="#17243d" font-weight="700">Source-aware selection</text>
<text x="532" y="625" font-size="18" fill="#596b85" font-weight="400">Filter invalid / zero-variance candidates</text>
<text x="532" y="655" font-size="18" fill="#596b85" font-weight="400">Rank by reward std within each source</text>
<text x="532" y="685" font-size="18" fill="#596b85" font-weight="400">Best-effort quotas; prefer whole groups</text>
<text x="532" y="715" font-size="18" fill="#596b85" font-weight="400">Select 128; replenish candidates if needed</text>
<text x="532" y="745" font-size="18" fill="#596b85" font-weight="400">Final group may split; no advantage redo</text>
<rect x="40" y="520" width="420" height="260" rx="16" fill="#ffffff" stroke="#dae2ee"/>
<text x="62" y="552" font-size="13" fill="#7160a9" font-weight="700">06 / UPDATE</text>
<text x="62" y="589" font-size="23" fill="#17243d" font-weight="700">GRPO + FSDP</text>
<text x="62" y="625" font-size="18" fill="#596b85" font-weight="400">Learning rate 1e-6; visual tower frozen</text>
<text x="62" y="655" font-size="18" fill="#596b85" font-weight="400">Core: PPO epochs=1 → 1 update / step</text>
<text x="62" y="685" font-size="18" fill="#596b85" font-weight="400">PPO2: epochs=2 → 2 updates / step</text>
<text x="62" y="715" font-size="18" fill="#596b85" font-weight="400">Same rollout steps ≠ same compute</text>
<text x="62" y="745" font-size="18" fill="#596b85" font-weight="400">Updated policy generates next rollouts</text>
<path d="M980 650H936" fill="none" stroke="#8392aa" stroke-width="2.3" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M510 650H466" fill="none" stroke="#8392aa" stroke-width="2.3" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M250 520V470H720V431" fill="none" stroke="#13866f" stroke-width="2.3" stroke-linejoin="round"  marker-end="url(#loop)"/>
<text x="285" y="458" font-size="16" fill="#13866f" font-weight="700">Updated policy → next interaction batch</text>
<rect x="40" y="820" width="1360" height="140" rx="16" fill="#e9eef7"/>
<text x="62" y="853" font-size="20" fill="#17243d" font-weight="700">Implementation boundaries</text>
<text x="62" y="887" font-size="17" fill="#596b85" font-weight="400">Numeric extraction is a Video factor; Image sources use a judge. Numeric tool gating retains the upstream threshold.</text>
<text x="62" y="914" font-size="17" fill="#596b85" font-weight="400">Duplicate code OR feedback receives no new tool credit. This heuristic does not establish causal usefulness.</text>
<text x="62" y="941" font-size="17" fill="#596b85" font-weight="400">Shared runtime: spawn workers and bounded cleanup. Model / optimizer / RNG / dataloader state supports continuation.</text>
</g></svg>
